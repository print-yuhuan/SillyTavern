name: Build APK

# 触发规则：
# - push v* Tag         → 构建 release 包、签名、发布到 GitHub Releases（正式版，实现方案 §12）
# - push main/master    → 构建 debug 包，发布到滚动预发布 Release「ci-debug」并更新 workflow artifact
#                         （Releases 下载不限速；Actions artifact 下载会限速）
# - PR                  → 仅构建 debug 包并作为 workflow artifact（不发布 Release）
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # 让 JS actions 运行在 Node.js 24（消除 actions 的 Node 20 弃用告警）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24.16.0"
  ANDROID_API: "28"
  ABI: "arm64-v8a"
  # NDK r27d：libc++_shared.so 取自该版本，与 Android-Node-Builder 构建 libnode.so 所用 NDK 对齐（docs/04）。
  NDK_VERSION: "27.3.13750724"
  # libnode.so 来源：Android-Node-Builder 的 Release（已发布 libnode.so + libnode.so.sha256）。
  # 与 third_party/Android-Node-Builder/ 子模块锁定的 tag 保持一致。
  ANB_REPO: "print-yuhuan/Android-Node-Builder"
  ANB_RELEASE_TAG: "v1.0.0"

jobs:
  build:
    name: Build Android arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (含 submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 判定构建类型
        id: vars
        run: |
          set -eux
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version_name=0.0.0-ci" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        run: |
          set -eux
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "ndk;$NDK_VERSION"

      # ── libnode.so 准备：实现方案 §2/§12 ────────────────────────────────
      # 来源：Actions cache → Android-Node-Builder 的 Release（统一渠道）。
      # CI 不读取本机 D:\ 路径；libnode.so 由 Android-Node-Builder 的 build-libnode.yml 构建并随 Release 发布。
      - name: 恢复 libnode 缓存
        id: libnode-cache
        uses: actions/cache@v4
        with:
          path: android-app/src/main/jniLibs/${{ env.ABI }}
          key: libnode-${{ env.NODE_VERSION }}-api${{ env.ANDROID_API }}-${{ env.ABI }}-anb-${{ env.ANB_RELEASE_TAG }}

      - name: 下载 libnode.so（缓存未命中）
        if: steps.libnode-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          dest="android-app/src/main/jniLibs/${{ env.ABI }}"
          mkdir -p "$dest"
          anb="https://github.com/${ANB_REPO}/releases/download/${ANB_RELEASE_TAG}"
          if ! curl -fSL "${anb}/libnode.so" -o "$dest/libnode.so"; then
            echo "::error::无法从 ${ANB_REPO} 的 ${ANB_RELEASE_TAG} Release 下载 libnode.so，请确认该 Release 已发布该资产。"
            exit 1
          fi
          curl -fSL "${anb}/libnode.so.sha256" -o "$dest/libnode.so.sha256" || true
          echo "libnode 来源：${ANB_REPO}@${ANB_RELEASE_TAG}"

      - name: 校验 libnode.so 的 sha256
        run: |
          set -eux
          dest="android-app/src/main/jniLibs/${{ env.ABI }}"
          test -f "$dest/libnode.so"
          if [[ -f "$dest/libnode.so.sha256" ]]; then
            expected="$(awk '{print $1}' "$dest/libnode.so.sha256")"
            actual="$(sha256sum "$dest/libnode.so" | awk '{print $1}')"
            echo "expected=$expected actual=$actual"
            test "$expected" = "$actual"
          else
            echo "::warning::缺少 libnode.so.sha256，跳过校验。"
          fi
          file "$dest/libnode.so" || true

      # libnode.so 动态依赖 NDK 的 C++ 运行库 libc++_shared.so，必须一并打进 APK，
      # 否则真机动态链接器在 exec libnode.so 前即报 "library libc++_shared.so not found"。
      # 始终执行（不随 libnode 缓存命中而跳过），从 NDK 复制以保证与 libnode.so 的 ABI 一致。
      - name: 准备 libc++_shared.so（取自 NDK r27d，与 libnode.so ABI 对齐）
        run: |
          set -eux
          dest="android-app/src/main/jniLibs/${{ env.ABI }}"
          mkdir -p "$dest"
          # 解析 NDK 根目录：优先锁定的 r27d，其次环境变量，最后取 SDK 下最新 ndk/*。
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ndk="$sdk/ndk/${NDK_VERSION}"
          if [[ ! -d "$ndk" ]]; then
            ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME:-}}}"
          fi
          if [[ -z "${ndk:-}" || ! -d "$ndk" ]]; then
            ndk="$(ls -d "$sdk"/ndk/* 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          test -n "${ndk:-}" -a -d "$ndk"
          echo "使用 NDK：$ndk"
          # 兼容查找 libc++_shared.so：旧版 NDK 在 sources/cxx-stl；r27（含 r27d）起在 toolchains 的 sysroot。
          old="$ndk/sources/cxx-stl/llvm-libc++/libs/${{ env.ABI }}/libc++_shared.so"
          if [[ -f "$old" ]]; then
            src="$old"
          else
            src="$(find "$ndk"/toolchains/llvm/prebuilt/*/sysroot/usr/lib/aarch64-linux-android -maxdepth 1 -name libc++_shared.so 2>/dev/null | head -n1 || true)"
          fi
          if [[ -z "${src:-}" || ! -f "$src" ]]; then
            echo "::error::未在 NDK ($ndk) 中找到 libc++_shared.so（已尝试 cxx-stl 旧路径与 toolchains sysroot 新路径）。"
            exit 1
          fi
          cp -f "$src" "$dest/libc++_shared.so"
          echo "libc++_shared.so 来源：$src"
          ls -l "$dest"

      # ── 打包完整 SillyTavern 资产（第三/四阶段） ───────────────────────────
      # NodeService 已切换到真实 server.js，App 首启需解压这些资产，故每次构建都打包。
      # 产物 sillytavern-code.zip / sillytavern-modules.zip / version.json 写入
      # android-app/src/main/assets/，随后被「构建 APK」打进包内。
      - name: 安装 Node.js（打包 SillyTavern 资产用）
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: third_party/SillyTavern/package-lock.json

      - name: 打包 SillyTavern 资产（code.zip / modules.zip / version.json）
        env:
          ST_APP_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          ST_APP_VERSION_CODE: ${{ github.run_number }}
        run: bash packaging/package-sillytavern.sh

      - name: 准备签名 keystore（仅 release，且已配置 secret）
        id: signing
        if: steps.vars.outputs.is_release == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "keystore_path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "已解码 release keystore"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，release 包将回退 debug 签名（仅用于验证，勿作正式发布）。"
          fi

      - name: 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      - name: 构建 APK
        env:
          ST_APP_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          ST_APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eux
          if [[ "${{ steps.vars.outputs.is_release }}" == "true" ]]; then
            ./gradlew :android-app:assembleRelease --no-daemon --stacktrace
          else
            ./gradlew :android-app:assembleDebug --no-daemon --stacktrace
          fi

      - name: 收集并重命名 APK
        id: collect
        run: |
          set -eux
          mkdir -p out
          if [[ "${{ steps.vars.outputs.is_release }}" == "true" ]]; then
            src="$(find android-app/build/outputs/apk/release -name '*.apk' | head -n1)"
            name="SillyTavern-android-arm64-v8a-v${{ steps.vars.outputs.version_name }}.apk"
          else
            src="$(find android-app/build/outputs/apk/debug -name '*.apk' | head -n1)"
            name="SillyTavern-android-arm64-v8a-debug-${{ github.run_number }}.apk"
          fi
          test -n "$src"
          cp "$src" "out/$name"
          echo "apk_path=out/$name" >> "$GITHUB_OUTPUT"
          echo "apk_name=$name" >> "$GITHUB_OUTPUT"

      - name: 校验 APK 含原生库与 SillyTavern 资产
        run: |
          set -eux
          apk="${{ steps.collect.outputs.apk_path }}"
          entries="$(unzip -l "$apk")"
          echo "$entries" | grep -q "lib/${{ env.ABI }}/libnode.so"
          echo "$entries" | grep -q "lib/${{ env.ABI }}/libc++_shared.so"
          echo "$entries" | grep -q "assets/sillytavern-code.zip"
          echo "$entries" | grep -q "assets/sillytavern-modules.zip"
          echo "$entries" | grep -q "assets/version.json"
          echo "APK 校验通过：含 libnode.so / libc++_shared.so 与 code.zip / modules.zip / version.json"

      - name: 上传 APK 为 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.apk_name }}
          path: ${{ steps.collect.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      # ── 调试包发布到滚动预发布 Release（push main/master） ─────────────────
      # Releases 下载不限速，Actions artifact 下载会限速；故 main 的 debug 包也发到 Release。
      # 使用固定 tag「ci-debug」+ 固定资产名，--clobber 覆盖旧包，下载 URL 稳定且不堆积历史。
      # 下载地址：
      #   https://github.com/<owner>/<repo>/releases/download/ci-debug/SillyTavern-android-arm64-v8a-debug-latest.apk
      - name: 发布 debug 包到滚动预发布 Release（push main，下载不限速）
        if: steps.vars.outputs.is_release == 'false' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          tag="ci-debug"
          asset="out/SillyTavern-android-arm64-v8a-debug-latest.apk"
          cp "${{ steps.collect.outputs.apk_path }}" "$asset"
          {
            echo "SillyTavern Android（arm64-v8a）调试包 · 滚动更新（始终为最新提交）"
            echo
            echo "- 提交：${GITHUB_SHA}"
            echo "- 构建号：#${{ github.run_number }}"
            echo "- 内置 Node ${NODE_VERSION} / Android API ${ANDROID_API}"
            echo
            echo "本预发布由推送 main 自动刷新，仅保留最新调试包。Releases 下载不限速（Actions artifact 会限速）。"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --prerelease --title "调试包（最新）" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" --prerelease --title "调试包（最新）" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" "$asset" --clobber

      - name: 发布到 GitHub Releases（仅 v* Tag）
        if: steps.vars.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" "${{ steps.collect.outputs.apk_path }}" \
            --title "$tag" \
            --notes "SillyTavern Android (arm64-v8a) ${tag}。内置 Node ${NODE_VERSION} / API ${ANDROID_API}。" \
            || gh release upload "$tag" "${{ steps.collect.outputs.apk_path }}" --clobber
